x-django-environment: &django-environment
  BENCHMARK_MODE: "true"
  USE_WHITENOISE: ${USE_WHITENOISE:-true}
  DJANGO_DATABASE_MODE: ${DJANGO_DATABASE_MODE:-standard}
  DJANGO_CONN_MAX_AGE: ${DJANGO_CONN_MAX_AGE:-60}
  DJANGO_GEVENT_POOL_MAX: ${DJANGO_GEVENT_POOL_MAX:-20}
  RUNTIME_LABEL: ${RUNTIME_LABEL:-local-sync}
  GUNICORN_BIND: ${GUNICORN_BIND:-0.0.0.0:8000}
  GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-sync}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-1}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-1}
  GUNICORN_WORKER_CONNECTIONS: ${GUNICORN_WORKER_CONNECTIONS:-1000}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-30}
  GUNICORN_KEEPALIVE: ${GUNICORN_KEEPALIVE:-2}
  GUNICORN_ACCESS_LOG_ENABLED: ${GUNICORN_ACCESS_LOG_ENABLED:-false}
  DJANGO_LOG_LEVEL: ${DJANGO_LOG_LEVEL:-ERROR}

x-django-service: &django-service
  build:
    context: .
  image: zellit-django:local
  env_file:
    - .env
    - ../../shared/zellit/data/dataset.env
  environment: *django-environment

services:
  db:
    image: postgres:18.1
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=db --username=postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    init: true
    user: postgres
    volumes:
      - postgres-data:/var/lib/postgresql

  migrate:
    <<: *django-service
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      db:
        condition: service_healthy

  dataset:
    build:
      context: ../../shared/zellit
    image: zellit-data:local
    command:
      - generate
      - --spec
      - /app/data/spec.json
      - --output
      - /data/generated
      - --zip-input
      - /app/data/zip_codes.csv
    volumes:
      - zellit-generated:/data/generated

  seed:
    image: zellit-data:local
    command:
      - seed
      - --database-url
      - postgresql://postgres@db:5432/postgres
      - --data-dir
      - /data/generated
      - --manifest
      - /app/data/manifest.json
      - --if-needed
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      dataset:
        condition: service_completed_successfully
    volumes:
      - zellit-generated:/data/generated:ro

  api:
    <<: *django-service
    command: ["/code/scripts/serve.sh"]
    depends_on:
      seed:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    init: true

  artillery:
    build:
      context: ../../shared/zellit/benchmark
    image: zellit-artillery:local
    profiles: ["benchmark"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      RUN_ID: ${RUN_ID:-}
      RUN_METADATA_JSON: ${RUN_METADATA_JSON:-}
      RUNTIME_JSON_VALUE: ${RUNTIME_JSON_VALUE:-}
      EXECUTION_MODE: ${EXECUTION_MODE:-compose}
      REQUEST_CORPUS_PATH: /data/benchmark_requests.csv
      ENABLE_OVERLOAD: ${ENABLE_OVERLOAD:-0}
      SMOKE_RATE: ${SMOKE_RATE:-}
      SMOKE_DURATION: ${SMOKE_DURATION:-}
      BASELINE_RATE: ${BASELINE_RATE:-}
      BASELINE_DURATION: ${BASELINE_DURATION:-}
      WARMUP_RATE: ${WARMUP_RATE:-}
      WARMUP_DURATION: ${WARMUP_DURATION:-}
      STAIRCASE_RATES: ${STAIRCASE_RATES:-}
      STAIRCASE_DURATION: ${STAIRCASE_DURATION:-}
      SUSTAINED_RATE: ${SUSTAINED_RATE:-}
      SUSTAINED_DURATION: ${SUSTAINED_DURATION:-}
      OVERLOAD_RATE: ${OVERLOAD_RATE:-}
      OVERLOAD_DURATION: ${OVERLOAD_DURATION:-}
    volumes:
      - ../../shared/zellit/data/benchmark_requests.csv:/data/benchmark_requests.csv:ro
      - ../../shared/zellit/benchmark/results:/benchmark/results

  utility:
    <<: *django-service
    profiles: ["utility"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres-data:
  zellit-generated:
