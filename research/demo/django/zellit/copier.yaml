# Questions to ask the user
project_name:
    type: str
    help: Your project name
    default: my_django_project

# Template configuration
_templates_suffix: .jinja
_exclude:
    - "*.pyc"
    - "__pycache__"
    - ".git"
    - ".DS_Store"
    - "*.egg-info"
    - "*.pytest_cache"
    - ".coverage"
