[dependency-groups]
dev = [
  "django-test-plus",
  "factory-boy",
  "interrogate",
  "model-bakery",
  "pre-commit",
  "pytest",
  "pytest-cov",
  "pytest-django",
  "pytest-env",
  "pytest-xdist",
  "vinnie"
]

[project]
dependencies = [
  "django>=6.0,<6.1",
  "django-click",
  "django-db-geventpool",
  "django-dramatiq",
  "django-extensions",
  "django-health-check==3.24.0",
  "django-ninja",
  "django-structlog",
  "django-tailwind-cli<4.2",
  "django-tracer",
  "django-typer",
  "django-vite",
  "dramatiq[prometheus,redis]",
  "environs[django]",
  "gevent",
  "greenlet",
  "gunicorn",
  "ipython",
  "psycopg2-binary",
  "python-json-logger",
  "redis",
  "rich",
  "structlog",
  "whitenoise"
]
description = "Redis-backed Django ZIP lookup service"
name = "zip"
readme = "README.md"
requires-python = ">= 3.14"
version = "0.0.0"

[tool.interrogate]
fail-under = 100
quiet = false
verbose = 2
whitelist-regex = ["test_.*"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "--reuse-db"
markers = ["integration: requires the Compose Redis service"]
env = [
  "TESTING=True"
]
norecursedirs = ".* .git .github config deployed_static docker node_modules media scss static templates"
python_files = "test_*.py"

[tool.ruff]
# Exclude a variety of commonly ignored directories.
exclude = [
  ".bzr",
  ".direnv",
  ".eggs",
  ".git",
  ".github",
  ".hg",
  ".mypy_cache",
  ".ruff_cache",
  ".svn",
  ".tox",
  ".venv",
  "__pypackages__",
  "_build",
  "build",
  "dist",
  "migrations",
  "node_modules",
  "venv"
]
extend-include = ["*.pyi?"]
indent-width = 4
# Same as Black.
line-length = 88
# Assume Python >=3.14.
target-version = "py314"

[tool.ruff.format]
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, automatically detect the appropriate line ending.
line-ending = "auto"
# Like Black, use double quotes for strings.
quote-style = "double"

[tool.ruff.lint]
# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"
# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "I"]
ignore = ["E501", "E741"]  # temporary
select = [
  "B",  # flake8-bugbear
  "E",  # Pycodestyle
  "F",  # Pyflakes
  "I",  # isort
  "UP"  # pyupgrade
]
unfixable = []

[tool.ruff.lint.isort]
force-single-line = true
known-first-party = []
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
# Tests can use magic values, assertions, and relative imports
"tests/**/*" = ["PLR2004", "S101", "TID252"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.uv]
package = false
