services:
  db:
    image: postgres:18.1
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --host=db --username=postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    init: true
    user: postgres
    volumes:
      - fastapi-postgres-data:/var/lib/postgresql

volumes:
  fastapi-postgres-data:
