[project]
name = "zellit-api"
version = "0.1.0"
description = "Async PostgreSQL Zellit benchmark API"
readme = "README.md"
authors = [
    { name = "Calvin Hendryx-Parker", email = "calvin@sixfeetup.com" }
]
requires-python = ">=3.12.12"
dependencies = [
    "alembic>=1.16,<2",
    "asyncpg>=0.31,<0.32",
    "fastapi>=0.141,<0.142",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "uvicorn>=0.35,<1",
]


[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pytest>=9,<10",
    "pytest-asyncio>=1,<2",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
markers = ["integration: requires the Compose PostgreSQL service"]
